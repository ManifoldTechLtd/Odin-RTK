# Fusion Parameters

# =============================================================================
# Algorithm Selection
# =============================================================================
# algorithm_type:
#   - "graph"     : ISAM2 factor graph fusion (GraphFusion)
#                   Full optimization, handles odom/GPS/heading factors.
#                   Best when odom has noise and continuous GPS correction is needed.
#   - "alignment" : Windowed 2D Procrustes alignment (AlignmentFusion)
#                   Closed-form least-squares estimate of wTo (yaw + xyz offset).
#                   Best when odom is accurate (e.g. SLAM result) and GPS only calibrates wTo.
algorithm_type: graph

# =============================================================================
# Noise Parameters
# =============================================================================
odom_position_sigma: 0.005    # Odometry position noise std dev (m/m) - SLAM result, accurate
odom_rotation_sigma: 0.1    # Odometry rotation noise std dev (rad)
gps_base_sigma: 5.0           # GPS base noise std dev (m), actual noise = gps_base_sigma * HDOP

# =============================================================================
# Fusion Parameters
# =============================================================================
initial_lever_arm: [-0.63, 0.0, 0.87]  # Antenna position in body frame [x, y, z] (m)
max_gps_match_dt: 0.5                # Max GPS-odom timestamp difference (s)
max_nodes: 5000                      # Max node count (marginalization threshold)
disable_gps_time_offset_estimation: false

# =============================================================================
# Initialization Parameters
# =============================================================================
init_gps_buffer_size: 30        # Init GPS buffer size
init_min_gps_displacement: 2.0  # Min GPS displacement for init (m)
init_min_odom_displacement: 2.0 # Min odom displacement for init (m)
init_yaw_prior_sigma: 0.2       # Initial yaw prior noise (rad)

# =============================================================================
# Coordinate Reference System (CRS) Parameters
# =============================================================================
# input_lla_crs: Input LLA coordinate system (EPSG:4326=WGS84, EPSG:4490=CGCS2000)
# output_project_target_crs: Target projection coordinate system
#   - EPSG:32650 = WGS84 / UTM zone 50N (E114-120)
#   - EPSG:4526 = CGCS2000 / 3-degree Gauss-Kruger zone 38 (Shenzhen)
#   - EPSG:4527 = CGCS2000 / 3-degree Gauss-Kruger zone 39 (Beijing)
input_lla_crs: EPSG:4326
output_project_enable: true
output_project_target_crs: EPSG:32650